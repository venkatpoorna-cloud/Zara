
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zara AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 20px;
      text-align: center;
      background: #151b30;
      border-bottom: 1px solid #303853;
    }
    header h1 { margin: 0; color: #a78bfa; }
    header p { color: #b8bfd6; margin-bottom: 0; }
    main {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 20px;
      flex: 1;
    }
    #chat {
      min-height: 300px;
      max-height: 55vh;
      overflow-y: auto;
      padding: 15px;
      background: #131a2b;
      border-radius: 16px;
      margin-bottom: 15px;
    }
    .msg {
      padding: 12px 14px;
      margin: 10px 0;
      border-radius: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .bot { background: #252d46; }
    .user { background: #5b43a8; margin-left: 25px; }
    .controls { display: flex; gap: 8px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #414b68;
      border-radius: 12px;
      background: #151b30;
      color: white;
      font-size: 16px;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 15px;
      background: #8b5cf6;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:active { opacity: 0.8; }
    footer { text-align: center; padding: 15px; color: #929bb5; }
  </style>
</head>
<body>
  <header>
    <h1>✦ Zara AI</h1>
    <p>Your personal AI assistant</p>
  </header>

  <main>
    <div id="chat" aria-live="polite">
      <div class="msg bot">
        Hi! 👋 I'm Zara. Welcome! Type "help" to see what I can do.
      </div>
    </div>

    <div class="controls">
      <input id="message" placeholder="Message Zara..."
        autocomplete="off">
      <button id="send">Send</button>
    </div>
  </main>

  <footer>Made with ❤️ · Zara AI</footer>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("message");

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function reply(message) {
      const text = message.toLowerCase().trim();

      if (text.includes("hello") || text.includes("hi")) {
        return "Hello! 😊 Welcome to Zara AI. How can I help you?";
      }
      if (text.includes("your name") || text.includes("who are you")) {
        return "I'm Zara AI, your personal assistant! ✨";
      }
      if (text.includes("help")) {
        return "You can greet me, ask my name, or ask for a simple calculation.";
      }
      if (text.includes("time")) {
        return "Your device time is " +
          new Date().toLocaleTimeString() + ".";
      }
      if (/^[\d\s()+\-*/.]+$/.test(text)) {
        try {
          const result = Function('"use strict"; return (' + text + ')')();
          if (typeof result === "number" && Number.isFinite(result)) {
            return "The answer is " + result;
          }
        } catch (e) {}
      }
      return "Thanks for your message! 😊 I'm currently a demo assistant. Real AI answers need an AI API connected to a secure backend.";
    }

    function sendMessage() {
      const message = input.value.trim();
      if (!message) return;
      addMessage(message, "user");
      input.value = "";
      addMessage(reply(message), "bot");
      input.focus();
    }

    document.getElementById("send").addEventListener("click", sendMessage);
    input.addEventListener("keydown", event => {
      if (event.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
